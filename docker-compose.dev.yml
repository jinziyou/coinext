# Coinext — local DEV overrides.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   # with observability:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.obs.yml up -d
#
# Changes vs prod:
#   * Publish service ports on localhost.
#   * Bind-mount lifecycle sources for pure-Python iteration.
#   * API uses uvicorn --reload on */python + service app.
#
# Hot-reload notes:
#   * api: pure-Python reloads; rebuild image for coinext_py / Rust changes.
#   * trader / risk-monitor: remount source; restart container to pick up changes.
#   * ingestor / exec-svc: rebuild image, or cargo run on host against published infra ports.
#   * ui: host `npm run dev` for HMR (stop compose ui first); this overlay serves the built bundle.

name: coinext

# Per-path anchors (Compose cannot merge sequence anchors into another sequence).
x-vol-foundation: &vol-foundation ./foundation:/app/foundation:ro
x-vol-market-data: &vol-market-data ./market-data:/app/market-data:ro
x-vol-strategy: &vol-strategy ./strategy-research:/app/strategy-research:ro
x-vol-backtest: &vol-backtest ./backtesting-simulation:/app/backtesting-simulation:ro
x-vol-analytics: &vol-analytics ./analytics-optimization:/app/analytics-optimization:ro
x-vol-risk: &vol-risk ./risk-portfolio:/app/risk-portfolio:ro
x-vol-exec: &vol-exec ./execution-live:/app/execution-live:ro
x-vol-ops: &vol-ops ./operations-interface:/app/operations-interface:ro

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  ingestor:
    ports:
      - "9101:9101"
    environment:
      COINEXT__LOG__LEVEL: debug

  exec-svc:
    ports:
      - "9102:9102"
      - "8081:8081"
    environment:
      COINEXT__LOG__LEVEL: debug

  trader:
    ports:
      - "9103:9103"
    environment:
      COINEXT__LOG__LEVEL: debug
    volumes:
      - *vol-foundation
      - *vol-market-data
      - *vol-strategy
      - *vol-backtest
      - *vol-analytics
      - *vol-risk
      - *vol-exec
      - *vol-ops
      - ./execution-live/services/trader:/app/trader:ro
      - ./data:/data

  risk-monitor:
    ports:
      - "9104:9104"
    environment:
      COINEXT__LOG__LEVEL: debug
    volumes:
      - *vol-foundation
      - *vol-market-data
      - *vol-strategy
      - *vol-backtest
      - *vol-analytics
      - *vol-risk
      - *vol-exec
      - *vol-ops
      - ./risk-portfolio/services/risk-monitor:/app/risk_monitor:ro

  api:
    ports:
      - "8000:8000"
    environment:
      COINEXT__LOG__LEVEL: debug
    volumes:
      - *vol-foundation
      - *vol-market-data
      - *vol-strategy
      - *vol-backtest
      - *vol-analytics
      - *vol-risk
      - *vol-exec
      - *vol-ops
      - ./operations-interface/services/api:/app/api:ro
      - ./data:/data
    command:
      [
        "uvicorn",
        "app:app",
        "--app-dir",
        "/app/api",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/api",
        "--reload-dir",
        "/app/foundation/python",
        "--reload-dir",
        "/app/market-data/python",
        "--reload-dir",
        "/app/strategy-research/python",
        "--reload-dir",
        "/app/backtesting-simulation/python",
        "--reload-dir",
        "/app/analytics-optimization/python",
        "--reload-dir",
        "/app/risk-portfolio/python",
        "--reload-dir",
        "/app/execution-live/python",
        "--reload-dir",
        "/app/operations-interface/python",
      ]

  ui:
    ports:
      - "3000:80"
