# Coinext — local DEV overrides.
#
# Layered on top of docker-compose.yml (and optionally docker-compose.obs.yml):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   # with observability:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.obs.yml up -d
#
# What this overlay changes vs prod:
#   * Exposes every service port on localhost so you can hit them directly.
#   * Bind-mounts root workflow modules into the Python/UI containers for fast iteration.
#   * Switches long-running app processes to hot-reload entrypoints where the runtime supports it.
#
# HOT-RELOAD NOTES
#   * api (FastAPI/uvicorn): `--reload` watches the bind-mounted root workflow modules' */python trees
#     plus the API service app. NOTE the compiled coinext_py extension is built into the image; if you
#     change Rust under foundation/ffi-bridge/rust/coinext-py you must rebuild (`just py-build` locally,
#     or `docker compose build api`). Pure-Python edits reload.
#   * trader / risk-monitor: bind-mounted source; restart the container to pick up changes, or run
#     them under `watchfiles` (see commented command). The Kernel itself is the compiled coinext_py.
#   * ingestor / exec-svc (Rust): no in-container hot reload — rebuild the image, or run the binary
#     on the host with `cargo run --manifest-path market-data/ingestion-service/rust/coinext-ingest/Cargo.toml` /
#     `cargo run --manifest-path execution-live/execution-service/rust/coinext-exec-svc/Cargo.toml`
#     against the dev infra ports below.
#   * ui (Vite): for true HMR run `npm run dev` on the host (port 3000; stop the compose `ui`
#     service first). This overlay serves the built static bundle via nginx on :3000.

name: coinext

services:
  # --- Infra: expose ports to the host for psql / redis-cli / mc / browser console ---
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

  # --- Rust hot path: expose metrics + control; rebuild image to change code ---
  ingestor:
    ports:
      - "9101:9101"   # prometheus metrics
    environment:
      COINEXT__LOG__LEVEL: debug

  exec-svc:
    ports:
      - "9102:9102"   # prometheus metrics
      - "8081:8081"   # control/admin API
    environment:
      COINEXT__LOG__LEVEL: debug

  # --- Python control plane: bind-mount source for fast iteration ---
  trader:
    ports:
      - "9103:9103"   # prometheus metrics
    environment:
      COINEXT__LOG__LEVEL: debug
    volumes:
      - ./foundation:/app/foundation:ro
      - ./market-data:/app/market-data:ro
      - ./strategy-research:/app/strategy-research:ro
      - ./backtesting-simulation:/app/backtesting-simulation:ro
      - ./analytics-optimization:/app/analytics-optimization:ro
      - ./risk-portfolio:/app/risk-portfolio:ro
      - ./execution-live:/app/execution-live:ro
      - ./operations-interface:/app/operations-interface:ro
      - ./execution-live/trader-service/service/trader:/app/trader:ro
      - ./data:/data
    # Restart-to-reload by default. For auto-reload uncomment:
    # command: ["uv", "run", "watchfiles", "python -m main", "foundation", "market-data", "strategy-research", "backtesting-simulation", "analytics-optimization", "risk-portfolio", "execution-live", "operations-interface", "trader"]

  risk-monitor:
    ports:
      - "9104:9104"   # prometheus metrics
    environment:
      COINEXT__LOG__LEVEL: debug
    volumes:
      - ./foundation:/app/foundation:ro
      - ./market-data:/app/market-data:ro
      - ./strategy-research:/app/strategy-research:ro
      - ./backtesting-simulation:/app/backtesting-simulation:ro
      - ./analytics-optimization:/app/analytics-optimization:ro
      - ./risk-portfolio:/app/risk-portfolio:ro
      - ./execution-live:/app/execution-live:ro
      - ./operations-interface:/app/operations-interface:ro
      - ./risk-portfolio/risk-monitor/service/risk-monitor:/app/risk_monitor:ro

  api:
    ports:
      - "8000:8000"
    environment:
      COINEXT__LOG__LEVEL: debug
    volumes:
      - ./foundation:/app/foundation:ro
      - ./market-data:/app/market-data:ro
      - ./strategy-research:/app/strategy-research:ro
      - ./backtesting-simulation:/app/backtesting-simulation:ro
      - ./analytics-optimization:/app/analytics-optimization:ro
      - ./risk-portfolio:/app/risk-portfolio:ro
      - ./execution-live:/app/execution-live:ro
      - ./operations-interface:/app/operations-interface:ro
      - ./operations-interface/api/service/api:/app/api:ro
      - ./data:/data
    # uvicorn auto-reload on the bind-mounted app + root workflow modules (pure-Python changes only; see header note).
    command: ["uvicorn", "app:app", "--app-dir", "/app/api", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/api", "--reload-dir", "/app/foundation", "--reload-dir", "/app/market-data", "--reload-dir", "/app/strategy-research", "--reload-dir", "/app/backtesting-simulation", "--reload-dir", "/app/analytics-optimization", "--reload-dir", "/app/risk-portfolio", "--reload-dir", "/app/execution-live", "--reload-dir", "/app/operations-interface"]

  # --- UI: serve the built bundle on :3000; use host `npm run dev` for HMR ---
  ui:
    ports:
      - "3000:80"
