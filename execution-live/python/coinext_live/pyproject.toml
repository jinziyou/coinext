# Coinext workspace member — import as `coinext_live`.
[project]
name = "coinext_live"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_live`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_live"]

[tool.setuptools.package-dir]
"coinext_live" = "."
