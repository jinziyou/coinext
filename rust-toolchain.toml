# Pin to the stable channel. MSRV floor is `rust-version = "1.95"` in the root Cargo.toml
# (enforced by cargo at build). CI and Docker also use stable / MSRV-aligned images — see
# operations-interface/deployment/docker/*.Dockerfile and .github/workflows/ci.yml.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
