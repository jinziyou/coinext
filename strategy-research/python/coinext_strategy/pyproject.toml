# Coinext workspace member — import as `coinext_strategy`.
[project]
name = "coinext_strategy"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_strategy`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_strategy"]

[tool.setuptools.package-dir]
"coinext_strategy" = "."
