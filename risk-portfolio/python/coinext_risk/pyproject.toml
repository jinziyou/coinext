# Coinext workspace member — import as `coinext_risk`.
[project]
name = "coinext_risk"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_risk`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_risk"]

[tool.setuptools.package-dir]
"coinext_risk" = "."
