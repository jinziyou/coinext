# Coinext — Rust workspace (the hot path + shared domain, the source of truth).
# Python mirrors this domain via PyO3 (see foundation/ffi-bridge/rust/coinext-py and root workflow module */python directories).
[workspace]
resolver = "2"
members = [
    "foundation/primitives/rust/coinext-core",
    "foundation/domain-model/rust/coinext-model",
    "foundation/ports/rust/coinext-ports",
    "foundation/state-cache/rust/coinext-cache",
    "operations-interface/bus/rust/coinext-bus",
    "strategy-research/indicators/rust/coinext-indicators",
    "analytics-optimization/derivatives/rust/coinext-derivatives",
    "risk-portfolio/risk-engine/rust/coinext-risk-engine",
    "risk-portfolio/portfolio-engine/rust/coinext-portfolio",
    "market-data/data-engine/rust/coinext-data-engine",
    "execution-live/execution-engine/rust/coinext-exec-engine",
    "backtesting-simulation/simulated-exchange/rust/coinext-sim",
    "backtesting-simulation/kernel/rust/coinext-kernel",
    "foundation/testkit/rust/coinext-testkit",
    "foundation/ffi-bridge/rust/coinext-py",
    "backtesting-simulation/examples/rust/backtest-sma",
]
# coinext-py is a member but its pyo3 dependency is OPTIONAL and gated behind the `python` feature, so
# the default `cargo test` builds it as an (empty) lib without linking libpython. maturin enables
# the feature: `uvx maturin develop --manifest-path foundation/ffi-bridge/rust/coinext-py/Cargo.toml --features python`.
# The crates below pull heavy network/db deps and are kept out of the default build as stubs.
exclude = [
    "market-data/network-transport/rust/coinext-network",
    "market-data/venue-adapters/binance/rust/coinext-adapters-binance",
    "operations-interface/persistence/rust/coinext-persistence",
    "market-data/ingestion-service/rust/coinext-ingest",
    "execution-live/execution-service/rust/coinext-exec-svc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Coinext"]

# Single source of dependency versions, inherited by member crates via `.workspace = true`.
[workspace.dependencies]
coinext-core = { path = "foundation/primitives/rust/coinext-core" }
coinext-model = { path = "foundation/domain-model/rust/coinext-model" }
coinext-ports = { path = "foundation/ports/rust/coinext-ports" }
coinext-cache = { path = "foundation/state-cache/rust/coinext-cache" }
coinext-bus = { path = "operations-interface/bus/rust/coinext-bus" }
coinext-indicators = { path = "strategy-research/indicators/rust/coinext-indicators" }
coinext-derivatives = { path = "analytics-optimization/derivatives/rust/coinext-derivatives" }
coinext-risk-engine = { path = "risk-portfolio/risk-engine/rust/coinext-risk-engine" }
coinext-portfolio = { path = "risk-portfolio/portfolio-engine/rust/coinext-portfolio" }
coinext-data-engine = { path = "market-data/data-engine/rust/coinext-data-engine" }
coinext-exec-engine = { path = "execution-live/execution-engine/rust/coinext-exec-engine" }
coinext-sim = { path = "backtesting-simulation/simulated-exchange/rust/coinext-sim" }
coinext-kernel = { path = "backtesting-simulation/kernel/rust/coinext-kernel" }
coinext-testkit = { path = "foundation/testkit/rust/coinext-testkit" }

rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
fnv = "1"
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
# NOTE: do NOT set `panic = "abort"` here. The maturin --release wheel inherits this profile, and
# under panic=abort a Rust panic inside the PyO3 bridge raises SIGABRT and kills the whole Python
# interpreter instead of surfacing as a catchable Python exception. Keep the default (unwind) so
# pyo3 can translate panics into Python exceptions.
