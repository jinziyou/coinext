# Coinext workspace member — import as `coinext_derivatives`.
[project]
name = "coinext_derivatives"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_derivatives`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_derivatives"]

[tool.setuptools.package-dir]
"coinext_derivatives" = "."
