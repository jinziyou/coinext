# Coinext workspace member — import as `coinext_screen`.
[project]
name = "coinext_screen"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_screen`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_screen"]

[tool.setuptools.package-dir]
"coinext_screen" = "."
