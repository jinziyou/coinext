# Coinext workspace member — import as `coinext_optimize`.
[project]
name = "coinext_optimize"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_optimize`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_optimize"]

[tool.setuptools.package-dir]
"coinext_optimize" = "."
