# Coinext workspace member — import as `coinext_analytics`.
[project]
name = "coinext_analytics"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_analytics`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_analytics"]

[tool.setuptools.package-dir]
"coinext_analytics" = "."
