# Coinext workspace member — import as `coinext_bus`.
[project]
name = "coinext_bus"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_bus`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_bus"]

[tool.setuptools.package-dir]
"coinext_bus" = "."
