# Coinext workspace member — import as `coinext_backtest`.
[project]
name = "coinext_backtest"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_backtest`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_backtest"]

[tool.setuptools.package-dir]
"coinext_backtest" = "."
