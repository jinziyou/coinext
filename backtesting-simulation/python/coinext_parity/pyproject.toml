# Coinext workspace member — import as `coinext_parity`.
[project]
name = "coinext_parity"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_parity`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_parity"]

[tool.setuptools.package-dir]
"coinext_parity" = "."
