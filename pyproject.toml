# Coinext — Python control plane (managed by uv). The Rust domain is exposed to Python by the
# `coinext_py` extension module (built with maturin from foundation/crates/coinext-py);
# pure-Python packages live under lifecycle modules' `python/` directories.
[project]
name = "coinext"
version = "0.1.0"
description = "Coinext — Python control plane for the Rust+Python quant platform"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
# Core control-plane deps: analytics numerics + config always present so layered YAML/env loading
# does not silently degrade. Heavier research/live/ops deps stay optional.
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
research = ["polars>=1.0", "pandas>=2.0", "matplotlib>=3.8", "duckdb>=1.0", "pyarrow>=16", "optuna>=3.6"]
# `config` kept as an alias extra for older install docs (`uv sync --extra config`).
config = []
cli = ["typer>=0.12"]
bus = ["redis>=5", "msgpack>=1.2.1"]  # >=1.2.1: GHSA-6v7p-g79w-8964
api = ["fastapi>=0.110", "uvicorn>=0.29", "starlette>=1.3.1"]  # starlette floor: CVE-2026-54282/54283
live = ["anyio>=4"]
ib = ["ib_insync>=0.9.86"]
obs = ["structlog>=24", "prometheus-client>=0.20", "opentelemetry-sdk>=1.25"]
all = [
    "coinext[research,cli,bus,api,live,ib,obs]",
]

[project.scripts]
coinext = "coinext_cli.main:app"

[dependency-groups]
# httpx2: required by starlette>=1.3 TestClient (the API auth/control-plane tests).
dev = ["pytest>=8", "ruff>=0.5", "maturin>=1.7", "httpx2"]

# Scaffold-friendly: lifecycle `python/` packages are importable without a full editable install
# so `pytest` works against the source tree. Paths match the flattened layout:
#   <lifecycle>/python/<coinext_*>
[tool.pytest.ini_options]
pythonpath = [
    "foundation/python",
    "market-data/python",
    "strategy-research/python",
    "backtesting-simulation/python",
    "analytics-optimization/python",
    "risk-portfolio/python",
    "execution-live/python",
    "operations-interface/python",
    ".",
]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# `ruff format` owns code width (line-length above); E501 here would only fire on prose
# comments/docstrings it never reflows, so we don't hand-wrap them.
ignore = ["E501"]

[tool.uv]
package = false
