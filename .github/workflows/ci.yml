# Coinext CI — verifies the Rust core workspace and the Python control plane on every push/PR.
#
# Jobs:
#   * rust            — fmt check, clippy (warnings as errors), and the core `cargo test` suite.
#   * python          — uv sync with tested extras, build `coinext_py`, then ruff + pytest.
#   * excluded-crates — tests/builds workspace-excluded live-edge crates.
#   * supply-chain    — cargo-audit + pip-audit.
#   * compose-validate — parses base/dev/observability compose topologies.
#
# Local equivalents live in the justfile (`just lint`, `just test`, `just test-live-edge`,
# `just py-build`, `just py-test`, `just compose-check`). Toolchains: stable Rust (MSRV floor
# 1.95 enforced by the workspace Cargo.toml's `rust-version`) and Python 3.13.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (core workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (core workspace)
        run: cargo test --workspace

  python:
    name: python (control plane)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COINEXT__REDIS__URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7

      # uv manages the venv + deps (see pyproject.toml [tool.uv]); it also provisions Python 3.13.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # maturin needs a Rust toolchain to compile the coinext_py PyO3 extension.
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Sync Python deps (research + config + api + bus extras, dev group)
        run: uv sync --extra research --extra config --extra api --extra bus --group dev

      # Build the compiled domain/runtime into the active venv so `import coinext_py` works for pytest.
      - name: Build coinext_py extension (maturin develop)
        run: uv run maturin develop --manifest-path foundation/crates/coinext-py/Cargo.toml --features python

      - name: Ruff lint
        run: uv run ruff check foundation market-data strategy-research backtesting-simulation analytics-optimization risk-portfolio execution-live operations-interface tests

      - name: Ruff format (check only)
        run: uv run ruff format --check foundation market-data strategy-research backtesting-simulation analytics-optimization risk-portfolio execution-live operations-interface tests

      # Paper OMS for Redis bus integration (exec.cmd → exec reports).
      - name: Start exec-svc (paper + redis)
        run: |
          mkdir -p .coinext
          cargo build --manifest-path execution-live/crates/coinext-exec-svc/Cargo.toml
          COINEXT__PERSIST__DB=.coinext/ci-exec.db \
          COINEXT__REDIS__URL=redis://127.0.0.1:6379/0 \
          COINEXT__EXEC__METRICS_ADDR=127.0.0.1:19102 \
          COINEXT__EXEC__CONTROL_ADDR=127.0.0.1:18081 \
            cargo run --manifest-path execution-live/crates/coinext-exec-svc/Cargo.toml \
            > /tmp/exec-svc.log 2>&1 &
          echo $! > /tmp/exec-svc.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18081/health >/dev/null; then
              echo "exec-svc ready"
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18081/health || (cat /tmp/exec-svc.log; exit 1)

      # Explicit A-share OMS e2e (T+1 / 涨跌停) — also covered by full pytest, but fail loudly here.
      - name: A-share OMS e2e (T+1 / price limit)
        run: uv run pytest tests/backtesting-simulation/test_ashare_t_plus_one.py -v --tb=short

      - name: Pytest
        run: uv run pytest

      - name: Stop exec-svc
        if: always()
        run: |
          if [ -f /tmp/exec-svc.pid ]; then kill "$(cat /tmp/exec-svc.pid)" || true; fi

  # The security-critical live-edge crates (network/venue adapter/persistence + the ingest/exec-svc
  # daemons) are WORKSPACE-EXCLUDED in the root Cargo.toml (they pull heavy network/db deps), so the
  # `rust` job above never compiles or tests them. They each have their OWN manifest + Cargo.lock, so
  # we drive them via --manifest-path here. Without this job, contract drift in these crates (e.g. a
  # field added to a shared coinext-network type) goes uncaught until a live deploy.
  excluded-crates:
    name: rust (excluded live-edge crates)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/live-edge
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Pure-domain crates with unit tests — build AND test them.
      - name: Test coinext-network
        run: cargo test --manifest-path market-data/crates/coinext-network/Cargo.toml
      - name: Test coinext-adapters-binance
        run: cargo test --manifest-path market-data/crates/coinext-adapters-binance/Cargo.toml
      - name: Test coinext-persistence
        run: cargo test --manifest-path operations-interface/crates/coinext-persistence/Cargo.toml

      # Service daemons (scaffolds today) — at least build them so their entrypoints stay compilable.
      - name: Build coinext-ingest
        run: cargo build --manifest-path market-data/crates/coinext-ingest/Cargo.toml
      - name: Build coinext-exec-svc
        run: cargo build --manifest-path execution-live/crates/coinext-exec-svc/Cargo.toml

  # Supply-chain hygiene: scan Rust + Python dependencies for known advisories (RUSTSEC / PyPI).
  supply-chain:
    name: supply-chain audit (cargo + pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audit the workspace lockfile plus each excluded crate's own lockfile (they vendor separately).
      - name: cargo audit (workspace)
        run: cargo audit
      - name: cargo audit (excluded crates)
        run: |
          for f in \
            market-data/crates/coinext-network/Cargo.lock \
            market-data/crates/coinext-adapters-binance/Cargo.lock \
            operations-interface/crates/coinext-persistence/Cargo.lock \
            market-data/crates/coinext-ingest/Cargo.lock \
            execution-live/crates/coinext-exec-svc/Cargo.lock; do
            if [ -f "$f" ]; then echo "::group::cargo audit $f"; cargo audit -f "$f"; echo "::endgroup::"; fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # pip-audit over third-party deps only. Workspace members are local editables and have no
      # content hash for pip-audit (`uv export --no-emit-workspace`).
      - name: pip-audit (python deps)
        run: |
          uv export --all-extras --no-emit-project --no-emit-workspace --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

  # Validate compose topology parsing (services, build contexts, anchors, dev/obs overlays, combined dev+obs)
  # WITHOUT building images. `env_file: .env` is required, so seed it from .env.example first.
  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Seed .env from the example (compose services use env_file)"
        run: cp .env.example .env

      - name: Validate base compose
        run: docker compose -f docker-compose.yml config -q
      - name: Validate base + dev overlay
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Validate base + observability overlay
        run: docker compose -f docker-compose.yml -f docker-compose.obs.yml config -q
      - name: Validate base + dev + observability overlays
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.obs.yml config -q
