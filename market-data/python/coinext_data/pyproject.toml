# Coinext workspace member — import as `coinext_data`.
[project]
name = "coinext_data"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_data`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_data"]

[tool.setuptools.package-dir]
"coinext_data" = "."
