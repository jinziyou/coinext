# Coinext workspace member — import as `coinext_broker`.
[project]
name = "coinext_broker"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_broker`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_broker"]

[tool.setuptools.package-dir]
"coinext_broker" = "."
