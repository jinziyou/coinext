# coinext-ingest — the market-data ingestion daemon (standalone Rust `ingestor` service).
#
# EXCLUDED from the root cargo workspace — explicit versions / path deps (no `.workspace = true`).
[package]
name = "coinext-ingest"
description = "Coinext market-data ingestion: Binance WS -> normalize -> data lake + Redis Envelope bus."
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Coinext"]

[[bin]]
name = "coinext-ingest"
path = "src/main.rs"

[features]
# `live` enables the real WS connect path (network). Off by default so `cargo build` is offline.
default = []
live = []

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1" }
rmp-serde = "1"
rust_decimal = "1"
rust_decimal_macros = "1"

coinext-adapters-binance = { path = "../coinext-adapters-binance" }
coinext-model = { path = "../../../foundation/crates/coinext-model" }
coinext-ports = { path = "../../../foundation/crates/coinext-ports" }
coinext-core = { path = "../../../foundation/crates/coinext-core" }
coinext-bus = { path = "../../../operations-interface/crates/coinext-bus" }
coinext-persistence = { path = "../../../operations-interface/crates/coinext-persistence" }
