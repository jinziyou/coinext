# Coinext workspace member — import as `coinext_config`.
[project]
name = "coinext_config"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_config`"
requires-python = ">=3.13"
dependencies = ['pydantic>=2.7', 'pyyaml>=6', 'numpy>=2.0']

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_config"]

[tool.setuptools.package-dir]
"coinext_config" = "."
