# Coinext workspace member — import as `coinext_contracts`.
[project]
name = "coinext_contracts"
version = "0.1.0"
description = "Coinext pure-Python package `coinext_contracts`"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coinext_contracts"]

[tool.setuptools.package-dir]
"coinext_contracts" = "."
